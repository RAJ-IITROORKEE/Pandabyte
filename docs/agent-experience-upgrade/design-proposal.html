<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Panda Agent — design proposal</title>
<style>
:root{color-scheme:light;--bg:#fcfcfc;--surface:#fff;--ink:#171717;--muted:#525252;--line:#dfdfdf;--soft:#f4f5f4;--accent:#006239;--action:#72e3ad;--on-action:#1e2723}html[data-theme=dark]{color-scheme:dark;--bg:#121212;--surface:#171717;--ink:#e2e8f0;--muted:#a2a2a2;--line:#292929;--soft:#242424;--accent:#4ade80;--action:#006239;--on-action:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif}button,input,textarea,select{font:inherit;color:inherit}button,select,input,textarea{border:1px solid var(--line);background:var(--surface);border-radius:7px}button{cursor:pointer;padding:9px 12px;min-height:40px}button:hover{background:var(--soft)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button[aria-pressed=true]{background:var(--soft);border-color:var(--accent);font-weight:650}button:disabled{opacity:.65;cursor:not-allowed}.primary{background:var(--action);color:var(--on-action);border-color:var(--accent);font-weight:650}.primary:hover{background:var(--action)}.muted{color:var(--muted)}.small{font-size:12px}.eyebrow{color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}.banner{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 20px;background:#d8f5e5;color:#183c29;font-size:12px}.banner strong{font-weight:700}.toolbar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--surface)}.toolbar .spacer{flex:1}.shell{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:calc(100dvh - 104px)}aside{border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}.brand{display:flex;align-items:center;gap:10px;margin:0 6px 20px;font-weight:700}.brand img{width:38px;height:38px;object-fit:contain;background:white;border-radius:5px}.brand span{line-height:1.2}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:400}.sidebutton{width:100%;text-align:left;border:0;background:transparent}.sidebutton[aria-pressed=true]{border:0;color:var(--accent)}.side-label{padding:12px 12px 3px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.side-bottom{margin-top:auto}main{min-width:0}.topline{min-height:65px;display:flex;align-items:center;gap:12px;padding:12px 28px;border-bottom:1px solid var(--line)}.topline strong{font-size:15px}.topline .spacer{flex:1}.mobile-menu{display:none}.content{max-width:1100px;margin:auto;padding:34px 36px 80px}.conversation{max-width:760px;margin:auto;height:calc(100dvh - 230px);min-height:330px;display:flex;flex-direction:column}.conversation .chat{flex:1;min-height:0;overflow:auto}.conversation .intro{flex-shrink:0}.conversation .composer{flex-shrink:0}.intro{margin:30px 0 24px}.intro h1{font-size:clamp(28px,4vw,40px);letter-spacing:-.04em;line-height:1.12;margin:10px 0}.intro p{max-width:540px;color:var(--muted)}h1{font-size:28px;letter-spacing:-.035em;margin:6px 0}h2{font-size:19px;letter-spacing:-.02em;margin:0 0 5px}h3{font-size:14px;margin:0 0 4px}p{margin:6px 0 12px}.chat{margin:18px 0 24px}.message{padding:16px 0;border-top:1px solid var(--line)}.message.user{padding-left:20%;}.bubble{background:var(--soft);border-radius:14px;padding:12px 16px}.cite{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:3px 7px;font-size:12px;color:var(--accent)}details{border-top:1px solid var(--line);padding:10px 0}summary{cursor:pointer;font-weight:600}.composer{position:static;margin-top:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:12px;box-shadow:0 6px 30px #00000008}.composer textarea{border:0;width:100%;resize:vertical;min-height:60px;background:transparent}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.actions .spacer{flex:1}.hint{font-size:12px;color:var(--muted);text-align:center;margin:10px}.tabs{display:flex;gap:3px;border-bottom:1px solid var(--line);overflow-x:auto;margin:22px 0}.tabs button{white-space:nowrap;border:0;border-radius:0;background:transparent;border-bottom:2px solid transparent;color:var(--muted)}.tabs button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--accent)}.heading{display:flex;align-items:start;justify-content:space-between;gap:20px}.heading p{color:var(--muted)}.notice{border-left:3px solid var(--accent);background:var(--soft);padding:12px 15px;margin:18px 0;color:var(--ink)}.rows{border-top:1px solid var(--line)}.row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:17px 2px;border-bottom:1px solid var(--line)}.row p{margin:2px 0;color:var(--muted);font-size:13px}.badge{font-size:11px;padding:4px 8px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(250px,.8fr);gap:32px}.panel{border:1px solid var(--line);border-radius:10px;padding:18px;background:var(--surface)}.field{display:grid;gap:5px;margin:13px 0;font-weight:600}.field input,.field select,.field textarea{padding:10px;width:100%;font-weight:400}.empty{padding:30px 0;color:var(--muted)}.status{padding:12px 14px;background:var(--soft);border-radius:8px;margin:12px 0}.code{background:var(--soft);padding:12px;border-radius:8px;overflow:auto;font-family:monospace}.meta{display:grid;gap:0;margin:12px 0}.meta div{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--line)}.meta dt{color:var(--muted)}.meta dd{margin:0;text-align:right}.proposal-only{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}[hidden]{display:none!important}@media(max-width:760px){.shell{display:block}.shell aside{display:none}.shell.menu-open aside{display:flex;border-right:0;border-bottom:1px solid var(--line)}.mobile-menu{display:inline-flex}.content{padding:24px 18px 60px}.topline{padding:12px 18px}.grid{grid-template-columns:1fr}.intro{margin-top:16px}.conversation{height:calc(100dvh - 270px);min-height:330px}.conversation .intro h1{font-size:26px}.conversation .intro{margin:0 0 10px}.conversation .intro p{margin:4px 0}.toolbar{padding:10px}.banner{padding:8px 12px}.row{align-items:flex-start}.heading{display:block}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}

/* Keep navigation and composer visible while the conversation itself scrolls. */
.close-navigation{display:none}@media(max-width:760px){.close-navigation{display:block;align-self:flex-end}}
body{height:100dvh;min-height:0;display:flex;flex-direction:column;overflow:hidden}.banner,.toolbar{flex:0 0 auto}.shell{flex:1;min-height:0;position:relative}aside{min-height:0;overflow:auto}main{min-height:0;display:flex;flex-direction:column}.topline{flex:0 0 auto}.content{width:100%;min-height:0;flex:1;overflow:auto}.content.chat-content{display:flex;flex-direction:column;padding-top:16px;padding-bottom:12px;overflow:hidden}.conversation{height:100%;min-height:0;width:100%}.conversation .chat{margin:10px 0;flex:1;min-height:0;overflow:auto}.conversation .intro.compact{margin:0 0 8px}.conversation .intro.compact h1{font-size:20px;line-height:1.25;margin:2px 0}.conversation .intro.compact p,.conversation .intro.compact .eyebrow{display:none}.conversation .composer{position:static}.conversation .hint{margin:4px}.conversation .composer textarea{min-height:44px}.conversation .empty,.conversation>.status{flex:1;overflow:auto}
@media(max-width:760px){.shell{display:flex}.shell aside{position:absolute;z-index:5;top:0;bottom:0;left:0;width:min(285px,85vw);box-shadow:0 12px 35px #0004}.shell.menu-open aside{display:flex;border-right:1px solid var(--line)}main{flex:1}.content.chat-content{padding:12px 14px 8px}.conversation{height:100%;min-height:0}.conversation .intro.compact h1{font-size:18px}}
</style></head>
<body>
<div class="banner"><span><strong>DESIGN PROPOSAL ONLY</strong> · Illustrative content and states. No requests, data or configuration changes.</span><span>Local review / P1.2</span></div>
<div class="toolbar" aria-label="Prototype controls"><span class="small muted">View:</span><button type="button" data-page="customer" aria-pressed="true">Customer agent</button><button type="button" data-page="rag" aria-pressed="false">Admin RAG</button><button type="button" data-page="skills" aria-pressed="false">Agent Skills</button><button type="button" data-page="playground" aria-pressed="false">Playground</button><span class="spacer"></span><button id="theme" type="button" aria-pressed="false">Dark theme</button></div>
<div class="shell" id="shell"><aside id="sidebar"><button type="button" id="close-navigation" class="close-navigation">Close navigation</button><div class="brand"><img src="../../public/brand/pandabyte-logo.png" alt="PandaByte"><span>PandaByte<small id="brand-subtitle">Panda Agent</small></span></div><div id="customer-nav"><button class="sidebutton" type="button" data-customer="new">＋ &nbsp; New chat</button><button class="sidebutton" type="button" data-customer="search">⌕ &nbsp; Search chats</button><div class="side-label">Recent conversations</div><button class="sidebutton" type="button" data-customer="history">Choosing a controller</button><button class="sidebutton" type="button" data-customer="history2">Sensor setup notes</button></div><div id="admin-nav" hidden><div class="side-label">Agent management</div><button class="sidebutton" data-page="rag">RAG Control</button><button class="sidebutton" data-page="skills">Agent Skills</button><button class="sidebutton" data-page="playground">Agent Playground</button></div><div class="side-bottom" id="customer-bottom"><button class="sidebutton" type="button" data-customer="memory">Memory &amp; context</button><button class="sidebutton" type="button" data-customer="settings">Settings</button><button class="sidebutton" type="button" data-customer="account">Account</button></div></aside>
<main><header class="topline"><button type="button" class="mobile-menu" id="menu" aria-expanded="false" aria-controls="sidebar">Menu</button><strong id="page-title" tabindex="-1">Panda Agent</strong><span class="spacer"></span><span class="small muted">Design preview</span></header><div class="content" id="content"></div></main></div>
<script>
const content=document.querySelector('#content'); let page='customer', customer='history', rag='Knowledge Sources', skill='Skills', state='Example answer', adminState='Example detail';
const placeholder='<span class="proposal-only">Illustrative layout · no real data</span>';
const composer=()=>`<div class="composer"><label class="small muted" for="prompt">Message Panda Agent</label><textarea id="prompt" placeholder="Ask a question…" readonly>${['Uploading','Upload failed','Cancelling','Connection unavailable'].includes(state)?'Illustrative draft: Please review this reference.':''}</textarea>${state==='Uploading'?'<div class="small">Illustrative upload · reference.pdf <progress max="100" value="45" aria-label="Illustrative upload progress">45%</progress> 45%</div>':state==='Upload failed'?'<div class="small">Illustrative upload failed · reference.pdf <button disabled>Retry upload</button> <button disabled>Remove</button></div>':''}<div class="actions"><button disabled title="Only when supported">Attach</button><button disabled title="Only when supported">Voice</button><button disabled>Model · if authorized</button><span class="spacer"></span><button class="primary" disabled>${state==='Streaming'?'Stop':'Send'}</button></div></div><p class="hint">Controls are inactive in this design proposal.</p>`;
const selector=`<label class="small muted" for="state">Illustrative state </label><select id="state"><option>Example answer</option><option>Empty</option><option>Streaming</option><option>Uploading</option><option>Upload failed</option><option>Cancelling</option><option>Connection unavailable</option><option>Interrupted</option><option>Restoring</option><option>Error</option></select>`;
function customerView(){if(customer==='memory')return `<div class="heading"><div><span class="eyebrow">Your account</span><h1>Memory &amp; context</h1><p>Review information used to personalize your experience.</p></div></div>${placeholder}<div class="notice">Memory controls shown here require a verified, owner-scoped implementation.</div><div class="rows"><div class="row"><div><h3>Saved context</h3><p>No example memories are displayed.</p></div><button disabled>Review</button></div><div class="row"><div><h3>Privacy controls</h3><p>Review, correct or delete supported memories.</p></div><button disabled>Manage</button></div></div>`;
if(customer==='settings'||customer==='account')return `<span class="eyebrow">Your account</span><h1>${customer==='settings'?'Settings':'Account'}</h1><p class="muted">${customer==='settings'?'Conversation preferences and supported controls.':'Identity and account controls remain with the existing account service.'}</p>${placeholder}<div class="rows"><div class="row"><div><h3>${customer==='settings'?'Appearance':'Profile'}</h3><p>${customer==='settings'?'Light, dark or system theme.':'Manage your existing account details.'}</p></div><button disabled>Manage</button></div></div>`;
if(customer==='search')return `<span class="eyebrow">Your conversations</span><h1>Search chats</h1><label class="field">Search<input placeholder="Search your conversations" readonly></label><p class="empty">Search results will appear here. This preview contains no history.</p>`;
let body=state==='Empty'?'<div class="empty">Start a conversation using the message box below.</div>':state==='Streaming'?'<div class="status">Illustration: response in progress. Stop would cancel the active request.</div>':state==='Uploading'?'<div class="status" role="status">Illustration: reference.pdf is uploading. Send is disabled; the draft is preserved.</div>':state==='Upload failed'?'<div class="status" role="alert">Illustration: reference.pdf could not be uploaded. The draft is preserved; retry or remove the attachment.</div>':state==='Cancelling'?'<div class="status" role="status">Illustration: cancellation requested; waiting for the request status. The draft is preserved.</div>':state==='Connection unavailable'?'<div class="status" role="alert">Illustration: connection unavailable. Your draft is preserved; check the connection before retrying.</div>':state==='Interrupted'?'<div class="status">Illustration: response interrupted. Check status or continue the conversation.</div>':state==='Restoring'?'<div class="status" role="status">Illustration: restoring this conversation and its last known request status…</div>':state==='Error'?'<div class="status" role="alert">Illustration: the response could not be completed. Your draft is preserved. <button disabled>Retry</button> <button disabled>Check status</button></div>':`<div class="chat"><div class="message user"><div class="bubble">How should I choose a controller for a sensor project?</div></div><div class="message"><strong>Panda Agent</strong><p>Start with the sensor interface, voltage requirements and the number of connections you need. Check the approved product documentation before choosing a board.</p><p><strong>Example Markdown</strong> with a short list:</p><ul><li>Compare interface and power requirements.</li><li>Check the approved documentation.</li></ul><div class="code"><code>sensor.read()</code> <button disabled>Copy code</button></div><p><button disabled>Copy answer</button> <button class="cite" disabled>Source 1 · Example document</button></p><details><summary>Activity · illustrative</summary><p class="muted">Example: approved knowledge retrieval · details and citations shown only if actually available.</p></details></div></div>`;
return `<div class="conversation"><div class="intro ${state==='Empty'||customer==='new'?'':'compact'}"><span class="eyebrow">Panda Agent</span><h1>${state==='Empty'||customer==='new'?'What are you working on?':customer==='history2'?'Sensor setup notes':'Choosing a controller'}</h1><p>Ask about a project, a product, or an idea. Continue naturally; the agent handles the route.</p></div><div>${selector}</div>${body}${composer()}</div>`}
const ragInfo={'Knowledge Sources':['Source intake','Upload or record a supported external source, inspect processing and document chunks.','Add source'], 'Review & Publication':['Review queue','Inspect rights, version and audit history before approval, publication or withdrawal.','Review source'], 'Retrieval Testing':['Retrieval test','Inspect real chunks, citations and ranking details where available.','Run retrieval'], 'RAG Evaluations':['Evaluations','Compare real evaluation runs and investigate unsupported answers.','Run evaluation'], 'Diagnostics':['Diagnostics','Inspect safe processing and retrieval failures; show measured latency only when available.','Refresh']};
const adminSelector=`<label class="small muted" for="admin-state">Illustrative view state </label><select id="admin-state"><option>Example detail</option><option>Loading</option><option>Empty</option><option>Error</option><option>Unavailable</option></select>`;
const stateMessage=()=>({Loading:'Illustration: loading current data…',Empty:'Illustration: no records match this view.',Error:'Illustration: the service could not be reached. Try again after checking status.',Unavailable:'Illustration: this operation is not supported or not ready in the current environment.'})[adminState];
const noAction=(...labels)=>`<div class="actions">${labels.map(x=>`<button disabled>${x}</button>`).join('')}</div>`;
const definition=(items)=>`<dl class="meta">${items.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
const genericState=()=>adminState==='Example detail'?'':`<div class="status" role="status">${stateMessage()} ${adminState==='Error'?'<button disabled>Retry</button>':''}</div>`;
const ragDetails={
'Knowledge Sources':`<div class="grid"><div><div class="row"><div><h3>Example document</h3><p>Upload · version 2 · processing status: not checked</p></div><span class="badge">Illustrative</span></div><div class="row"><div><h3>Example external link</h3><p>Metadata only · not fetched</p></div><button disabled>Inspect</button></div></div><div class="panel"><h3>Source details</h3>${definition([['Origin','Illustrative upload'],['Rights','Not reviewed'],['Processing','Not checked'],['Chunks','Not available'],['Version','Example 2']])}${noAction('Inspect chunks','Add upload','Add URL')}</div></div>`,
'Review & Publication':`<div class="grid"><div><div class="row"><div><h3>Example source · version 2</h3><p>Rights and publication decision pending</p></div><button disabled>Review</button></div></div><div class="panel"><h3>Review details</h3>${definition([['Rights evidence','Not supplied'],['Current version','Example 2'],['Audit history','No actual history'],['Publication','Not checked']])}<label class="field">Decision reason<textarea readonly placeholder="Required when supported"></textarea></label>${noAction('Approve','Reject','Publish','Withdraw')}</div></div>`,
'Retrieval Testing':`<div class="grid"><div><label class="field">Sample query<textarea readonly placeholder="Enter a test question"></textarea></label><label class="field">Result limit<select disabled><option>Runtime default</option></select></label>${noAction('Run retrieval')}<p class="small muted">Parameters appear only when supported.</p></div><div class="panel"><h3>Retrieved evidence</h3>${definition([['Chunk','No run'],['Source / citation','No run'],['Rank / similarity','Not measured'],['Relevance','Not assessed']])}</div></div>`,
'RAG Evaluations':`<div class="grid"><div><label class="field">Representative question<textarea readonly placeholder="Question under review"></textarea></label>${noAction('Add question','Run evaluation','Compare runs')}<p class="small muted">Existing evaluation runtime currently reports unavailable.</p></div><div class="panel"><h3>Evaluation results</h3>${definition([['Answer correctness','No run'],['Citation support','No run'],['Retrieval relevance','No run'],['Coverage / failures','No run'],['Configuration comparison','No run']])}</div></div>`,
'Diagnostics':`<div class="panel"><h3>Safe diagnostic details</h3>${definition([['Retrieval / processing error','No request'],['Request status','Not checked'],['Latency','Not measured'],['Token usage','Not measured'],['Safe reference','Unavailable']])}${noAction('Refresh diagnostics')}</div>`};
function ragView(){const [title,desc,action]=ragInfo[rag];return `<div class="heading"><div><span class="eyebrow">Admin / Panda Agent</span><h1>RAG Control</h1><p>Manage approved knowledge and inspect how it is used.</p></div><span class="badge">Existing control room</span></div><div class="notice">Illustrative fields, not real records or results. Current link intake saves metadata without fetching; evaluations are unavailable. Controls depend on verified service support.</div><nav class="tabs" aria-label="RAG sections">${Object.keys(ragInfo).map(x=>`<button data-rag="${x}" aria-pressed="${x===rag}">${x}</button>`).join('')}</nav><div class="heading"><div><h2>${title}</h2><p>${desc}</p></div><button disabled>${action}</button></div>${adminSelector}${genericState()}${adminState==='Example detail'?ragDetails[rag]:''}`}
const skillInfo={'Skills':['Discover and manage supported skills','Inspect origin, configuration requirements and validation.'], 'MCP Servers':['MCP connections','Inspect transport, discovery and last verified status.'], 'Tools':['Available tools','Group by harness, skill, MCP or approved integration.'], 'Configuration':['Harness configuration','Expose only controls verified by the harness.']};
const skillDetails={
'Skills':`<div class="grid"><div><div class="row"><div><h3>Example skill</h3><p>Illustrative description · origin: example source</p></div><span class="badge">Not checked</span></div>${noAction('Refresh discovery','Install external skill')}</div><div class="panel"><h3>Skill details</h3>${definition([['Source / origin','Example only'],['Availability','Not checked'],['Requirements','Not checked'],['Validation','Not run'],['Instructions','Not loaded']])}${noAction('Inspect instructions','Configure','Enable / disable','Remove','Test in Playground')}</div></div>`,
'MCP Servers':`<div class="grid"><div><div class="row"><div><h3>Example server</h3><p>Transport: example remote · configuration not verified</p></div><span class="badge">Not checked</span></div>${noAction('Add server','Connect / reconnect','Discover tools')}</div><div class="panel"><h3>Server configuration</h3><label class="field">Name<input readonly placeholder="Example server"></label><label class="field">Transport<select disabled><option>Choose supported transport</option></select></label><label class="field">Endpoint or command<input readonly placeholder="Supported configuration only"></label><label class="field">Credential reference<input readonly placeholder="Reference only; no raw secret"></label>${definition([['Enabled','Not checked'],['Connection / last error','Not checked'],['Discovered tools','No discovery'],['Local process support','Must be verified in harness environment']])}${noAction('Save','Enable / disable','Remove','Test in Playground')}</div></div>`,
'Tools':`<div class="grid"><div><div class="row"><div><h3>Example tool</h3><p>Illustrative description · source: harness / skill / MCP</p></div><span class="badge">Not checked</span></div></div><div class="panel"><h3>Tool details</h3>${definition([['Source','Illustrative'],['Availability','Not checked'],['Effective permission','Not checked'],['Execution enforcement','Required in harness']])}${noAction('Configure permission','Test in Playground')}</div></div>`,
'Configuration':`<div class="grid"><div><label class="field">Default agent<select disabled><option>Not checked</option></select></label><label class="field">Model / provider<select disabled><option>Not checked</option></select></label><label class="field">Permission profile<select disabled><option>Not checked</option></select></label>${noAction('Save supported settings')}</div><div class="panel"><h3>Runtime settings</h3>${definition([['Skill discovery','Not checked'],['MCP connections','Not checked'],['Tool availability','Not checked'],['Limits / status','Not checked']])}<p class="small muted">Unsupported fields remain unavailable. Changes use the verified harness interface.</p></div></div>`};
function skillsView(){let [title,desc]=skillInfo[skill];return `<div class="heading"><div><span class="eyebrow">Admin / Panda Agent</span><h1>Agent Skills</h1><p>Capabilities available through the existing harness.</p></div><button disabled>Refresh discovery</button></div><nav class="tabs" aria-label="Agent Skills sections">${Object.keys(skillInfo).map(x=>`<button data-skill="${x}" aria-pressed="${x===skill}">${x}</button>`).join('')}</nav><div class="heading"><div><h2>${title}</h2><p>${desc}</p></div></div><div class="notice">Illustrative fields and examples, not discovered capabilities. Enable an action only when the actual harness supports and authorizes it.</div>${adminSelector}${genericState()}${adminState==='Example detail'?skillDetails[skill]:''}`}
function playgroundView(){return `<div class="heading"><div><span class="eyebrow">Admin / Panda Agent</span><h1>Agent Playground</h1><p>Inspect a dedicated test conversation.</p></div><button disabled>Reset test session</button></div><div class="notice">Illustrative only: no request was run. Test scope must be isolated from customer conversations and memory.</div>${adminSelector}${genericState()}<div class="grid"><section><div class="panel"><div class="actions"><strong>Test conversation</strong><span class="spacer"></span><span class="badge">No request run</span></div>${adminState==='Example detail'?'<div class="message"><strong>Illustrative test prompt</strong><p>How would a permitted tool assist this request?</p></div><div class="message"><strong>Illustrative response area</strong><p>No response, activity or source has been generated.</p><details><summary>Activity and citations</summary><p>Not available until a real request is executed.</p></details></div>':''}${composer()}</div></section><section><div class="panel"><h2>Test configuration</h2><p class="small muted">Only verified runtime controls appear in the real interface.</p>${['Model / agent','Available skills','MCP connections','Permitted tools','RAG test profile'].map(x=>`<label class="field">${x}<select disabled><option>Not checked</option></select></label>`).join('')}</div><details open><summary>Inspect execution</summary>${definition([['Request status','No request'],['Selected model','Not measured'],['Skills / tools invoked','No execution'],['MCP calls','No execution'],['Retrieval evidence / citations','No retrieval'],['Execution error','None observed'],['Latency / tokens','Not measured']])}<p class="small muted">No private reasoning, credentials or sensitive payloads.</p></details></section></div>`}
function render(){document.querySelector('#page-title').textContent=({customer:'Panda Agent',rag:'RAG Control',skills:'Agent Skills',playground:'Agent Playground'})[page];document.querySelector('#brand-subtitle').textContent=page==='customer'?'Panda Agent':'Admin';document.querySelector('#customer-nav').hidden=page!=='customer';document.querySelector('#customer-bottom').hidden=page!=='customer';document.querySelector('#admin-nav').hidden=page==='customer';content.classList.toggle('chat-content',page==='customer' && !['memory','settings','account','search'].includes(customer));content.innerHTML=page==='customer'?customerView():page==='rag'?ragView():page==='skills'?skillsView():playgroundView();const sel=document.querySelector('#state');if(sel){sel.value=state;sel.onchange=()=>{state=sel.value;render();document.querySelector('#state')?.focus()}}const ads=document.querySelector('#admin-state');if(ads){ads.value=adminState;ads.onchange=()=>{adminState=ads.value;render();document.querySelector('#admin-state')?.focus()}}document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.page===page)));document.querySelectorAll('[data-customer]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.customer===customer)));}
const shell=document.querySelector('#shell'), sidebar=document.querySelector('#sidebar'), menu=document.querySelector('#menu'), main=document.querySelector('main'), toolbar=document.querySelector('.toolbar');
function closeNavigation(target=menu){if(!shell.classList.contains('menu-open'))return;shell.classList.remove('menu-open');menu.setAttribute('aria-expanded','false');sidebar.removeAttribute('role');sidebar.removeAttribute('aria-modal');sidebar.removeAttribute('aria-label');main.inert=false;toolbar.inert=false;target.focus()}
function openNavigation(){shell.classList.add('menu-open');menu.setAttribute('aria-expanded','true');sidebar.setAttribute('role','dialog');sidebar.setAttribute('aria-modal','true');sidebar.setAttribute('aria-label','Navigation');main.inert=true;toolbar.inert=true;document.querySelector('#close-navigation').focus()}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;const selected=sidebar.contains(b)&&(b.dataset.page||b.dataset.customer);if(b.dataset.page){page=b.dataset.page;render()}if(b.dataset.customer){customer=b.dataset.customer;render()}if(b.dataset.rag){rag=b.dataset.rag;render()}if(b.dataset.skill){skill=b.dataset.skill;render()}if(selected)closeNavigation(document.querySelector('#page-title'))});
document.querySelector('#theme').onclick=e=>{let dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';e.currentTarget.textContent=dark?'Light theme':'Dark theme';e.currentTarget.setAttribute('aria-pressed',String(dark))};
menu.onclick=()=>openNavigation();document.querySelector('#close-navigation').onclick=()=>closeNavigation();
document.addEventListener('keydown',e=>{if(!shell.classList.contains('menu-open'))return;if(e.key==='Escape'){e.preventDefault();closeNavigation();return}if(e.key==='Tab'){const buttons=[...sidebar.querySelectorAll('button:not(:disabled)')].filter(x=>x.getClientRects().length);const first=buttons[0],last=buttons.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
matchMedia('(min-width: 761px)').addEventListener('change',e=>{if(e.matches)closeNavigation(document.querySelector('#page-title'))});render();
</script></body></html>
