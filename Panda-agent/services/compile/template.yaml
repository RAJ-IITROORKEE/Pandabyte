AWSTemplateFormatVersion: "2010-09-09"
Description: PandaByte Arduino compile service (ECR + CodeBuild + container Lambda behind an HMAC-checked Function URL)
Parameters:
  ImageUri:
    Type: String
    Default: ""
    Description: Full ECR image URI incl. tag. Leave empty on first deploy, then set after CodeBuild has pushed.
  CompileSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: HMAC shared secret (same value as the Vercel env var).
  GitHubUrl:
    Type: String
    Default: https://github.com/RAJ-IITROORKEE/Pandabyte.git
    Description: Public GitHub repository URL containing Panda-agent/services/compile.
  GitHubBranch:
    Type: String
    Default: main
Conditions:
  HasImage: !Not [!Equals [!Ref ImageUri, ""]]
Resources:
  Repo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${AWS::StackName}-compile"
      ImageScanningConfiguration: { ScanOnPush: false }
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep 2 newest","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":2},"action":{"type":"expire"}}]}'

  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: codebuild.amazonaws.com }, Action: "sts:AssumeRole" }]
      Policies:
        - PolicyName: push-and-log
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - { Effect: Allow, Action: "ecr:GetAuthorizationToken", Resource: "*" }
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:InitiateLayerUpload, ecr:UploadLayerPart, ecr:CompleteLayerUpload, ecr:PutImage]
                Resource: !GetAtt Repo.Arn
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${AWS::StackName}-build*"

  Build:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AWS::StackName}-build"
      ServiceRole: !GetAtt BuildRole.Arn
      Artifacts: { Type: NO_ARTIFACTS }
      Source:
        Type: GITHUB
        Location: !Ref GitHubUrl
        BuildSpec: Panda-agent/services/compile/buildspec.yml
      SourceVersion: !Ref GitHubBranch
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM # 4 vCPU: core install + 7 pre-warm builds finish well inside the limit
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        EnvironmentVariables:
          - { Name: REPO_URI, Value: !GetAtt Repo.RepositoryUri }
          - { Name: AWS_REGION, Value: !Ref "AWS::Region" }
      TimeoutInMinutes: 60

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-fn"
      RetentionInDays: 1

  FunctionRole:
    Type: AWS::IAM::Role
    Condition: HasImage
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: "sts:AssumeRole" }]
      Policies:
        - PolicyName: own-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${LogGroup.Arn}:*"

  Function:
    Type: AWS::Lambda::Function
    Condition: HasImage
    DependsOn: LogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-fn"
      PackageType: Image
      Code: { ImageUri: !Ref ImageUri }
      Architectures: [x86_64]
      MemorySize: 3008
      Timeout: 120
      EphemeralStorage: { Size: 2048 }
      Role: !GetAtt FunctionRole.Arn
      Environment:
        Variables:
          PANDA_COMPILE_SECRET: !Ref CompileSecret

  FunctionUrl:
    Type: AWS::Lambda::Url
    Condition: HasImage
    Properties:
      TargetFunctionArn: !GetAtt Function.Arn
      AuthType: NONE # the HMAC header is the authentication

  UrlPermission:
    Type: AWS::Lambda::Permission
    Condition: HasImage
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  UrlInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: HasImage
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  RepoUri:
    Value: !GetAtt Repo.RepositoryUri
  CodeBuildProject:
    Value: !Ref Build
  FunctionUrl:
    Condition: HasImage
    Value: !GetAtt FunctionUrl.FunctionUrl
